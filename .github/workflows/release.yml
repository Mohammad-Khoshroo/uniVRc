name: Release uniVRc VS Code Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version Bump Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install lark pillow

      - name: Sync Grammar & Build VSIX
        id: build_vsix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python sync_from_lark.py --bump ${{ github.event.inputs.bump_type }}
          else
            python sync_from_lark.py
          fi
          VSIX_FILE=$(ls *.vsix | head -n 1)
          echo "VSIX_PATH=$VSIX_FILE" >> $GITHUB_ENV
          echo "Found VSIX: $VSIX_FILE"

      - name: Extract Tag or Version
        id: vars
        run: |
          VERSION=$(python -c "import json; print(json.load(open('package.json'))['version'])")
          echo "VERSION=v$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          name: uniVRc-${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          files: ${{ env.VSIX_PATH }}
          draft: false
          prerelease: false
          generate_release_notes: true
